# >>> AIM-FORK (whole file, AIM D-114): smoke test after every production
# deploy. The fork deploys `main` to production on merge (no staging), so a
# broken merge must show within minutes: scripts/aim-smoke.mjs embeds the live
# viewer the way the AIM host does, waits for the bridge's READY and asks
# `QUERY view_state`. A red run opens an issue through
# report-scheduled-failure.yml (when AIM_SCHEDULED_ISSUES is 'true'); roll back
# with Vercel's Instant Rollback (docs/FORK_MAINTENANCE.md).

name: AIM smoke after deploy

on:
  # Vercel reports each deployment to GitHub; only a successful Production one
  # is smoked (previews are tried by hand from the AIM host's viewer picker).
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Viewer URL to smoke
        required: false
        default: https://ifc-lite-viewer.vercel.app/
        type: string

permissions:
  contents: read

concurrency:
  group: aim-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: AIM smoke (bridge READY + view_state)
    if: >-
      github.repository != 'LTplus-AG/ifc-lite' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The production alias, not the per-deployment URL: that one sits behind
      # Vercel's login, and the alias is what the AIM host embeds.
      - name: Smoke the deployed viewer
        env:
          URL: ${{ inputs.url || 'https://ifc-lite-viewer.vercel.app/' }}
        run: node scripts/aim-smoke.mjs --url "$URL"

  report:
    needs: smoke
    if: always() && needs.smoke.result == 'failure'
    uses: ./.github/workflows/report-scheduled-failure.yml
    with:
      workflow_name: AIM smoke after deploy
      jobs: smoke
      result: ${{ needs.smoke.result }} at ${{ github.event.deployment.sha || github.sha }}
    permissions:
      contents: read
      issues: write
# <<< AIM-FORK
